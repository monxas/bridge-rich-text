<!doctype html>
<html>
	<head lang="en">
		<title>Insert Captured Text</title>
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
		<style>
			#preview {
				min-height: 28px;
				padding: 4px 8px;
				border-radius: 3px;
				background: #fff;
				color: #000;
				font-family: "Times New Roman", serif;
				font-size: 16pt;
				line-height: 1.3;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				max-height: 120px;
				overflow: auto;
			}
			#preview:empty { display: none; }
			#message { font-size: 9pt; opacity: 0.75; margin-top: 4px; }
		</style>
	</head>
	<body>
		<sdpi-item label="Text">
			<sdpi-button id="capture">Capture clipboard</sdpi-button>
		</sdpi-item>
		<sdpi-item label="">
			<div style="width: 100%">
				<div id="preview"></div>
				<div id="message">Copy the text you want in Word (or anywhere), then press Capture.</div>
			</div>
		</sdpi-item>
		<sdpi-item label="Keep">
			<sdpi-checkbox setting="keepColor" default="true" label="Colour"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="">
			<sdpi-checkbox setting="keepStyle" default="true" label="Bold / italic"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="">
			<sdpi-checkbox setting="keepFont" default="false" label="Font (off: font at the cursor)"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="">
			<sdpi-checkbox setting="keepSize" default="false" label="Size (off: size at the cursor)"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Clipboard">
			<sdpi-select setting="formats" default="auto">
				<option value="auto">HTML + RTF (recommended)</option>
				<option value="rtf">RTF only</option>
				<option value="html">HTML only</option>
				<option value="text">Plain text (no formatting)</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Word">
			<sdpi-checkbox setting="resetWordFormatting" default="true" label="Keep the text typed next unformatted"></sdpi-checkbox>
		</sdpi-item>
		<script>
			const client = SDPIComponents.streamDeckClient;
			const button = document.getElementById("capture");
			button.addEventListener("click", () => {
				document.getElementById("message").textContent = "Capturing…";
				client.send("sendToPlugin", { event: "capture" });
			});
			client.sendToPropertyInspector.subscribe((ev) => {
				const p = ev.payload || {};
				// The preview is HTML built by the plugin's own generator (text escaped, styles validated).
				if (typeof p.preview === "string") document.getElementById("preview").innerHTML = p.preview;
				if (typeof p.message === "string") document.getElementById("message").textContent = p.message;
			});
		</script>
	</body>
</html>
